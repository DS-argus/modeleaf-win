[package]
name = "modeleaf"
version = "0.1.0"
description = "Keyboard-first read-only PDF viewer for Windows"
authors = ["DS-argus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "modeleaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
