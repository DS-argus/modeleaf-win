# Modeleaf Windows configuration generated from the frozen product defaults.
# Copy this file to the application config directory before editing.

[keymap]
"document.open" = ["<C-S-o>"]
"document.close" = ["<C-w>"]
"document.print" = ["<C-p>"]
"app.quit" = ["<A-F4>"]
"app.new" = ["<C-n>"]
"palette.open" = [":", "<C-S-p>"]
"help.show" = ["?"]
"tab.next" = ["N"]
"tab.previous" = ["P"]
"scroll.left" = ["h", "<Left>"]
"scroll.down" = ["j", "<Down>"]
"scroll.up" = ["k", "<Up>"]
"scroll.right" = ["l", "<Right>"]
"scroll.largeDown" = ["d"]
"scroll.largeUp" = ["u"]
"page.next" = ["n"]
"page.previous" = ["p"]
"page.first" = ["gg"]
"page.last" = ["G"]
"page.prompt" = ["g"]
"history.back" = ["<A-Left>"]
"history.forward" = ["<A-Right>"]
"search.prompt" = ["/"]
"search.cancel" = ["<Esc>"]
"links.hint" = ["f"]
"view.zoomIn" = ["=", "+"]
"view.zoomOut" = ["-"]
"view.zoomReset" = ["0"]
"view.fitWidth" = ["w"]
"view.fitPage" = ["F"]
"view.rotateLeft" = ["["]
"view.rotateRight" = ["]"]
"config.reload" = ["<prefix>r"]
"config.writeDefault" = []
"config.resetDefault" = []
"theme.picker" = ["T"]
"update.show" = ["U"]

"path.showParent" = ["y"]
"path.copy" = ["yy"]
[navigation]
small_scroll_points = 32.0
large_scroll_viewport_fraction = 0.8
zoom_factor = 1.1

[input]
prefix_timeout_ms = 400
prefix = "<C-b>"
